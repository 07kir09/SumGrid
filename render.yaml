services:
  - type: web
    name: sum-grid-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: DATA_DIR
        value: /var/data
      - key: CORS_ALLOWED_ORIGINS
        sync: false
